name: lab5-ci

on:
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build services
        run: docker compose build

  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up --build -d
      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local code=""
            for attempt in $(seq 1 8); do
              code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi
              echo "Retry $attempt/8 for $url (got ${code:-none})"
              sleep 2
            done
            echo "FAIL $url after 8 attempts"
            return 1
          }
          check_url http://localhost:8080/
          check_url http://localhost:5001/
          check_url http://localhost:5002/
      - name: Stop services
        if: always()
        run: docker compose down -v

  evidence-pack:
    runs-on: ubuntu-latest
    needs: [smoke-check]
    steps:
      - uses: actions/checkout@v4
      - name: Generate reports
        run: python3 scripts/generate_lab5_report.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab5-report
          path: |
            reports/report.json
            reports/report.md
            reports/run-view.md
          if-no-files-found: error
